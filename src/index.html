<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="calculator-container">
    <h1>Калькулятор</h1>
    <p class="description">Введіть два числа та оберіть математичну дію</p>

    <div class="inputs-group">
      <input type="text" id="firstNumber" placeholder="Перше число">
      <input type="text" id="secondNumber" placeholder="Друге число">
    </div>

    <div class="buttons">
      <button id="addButton">+</button>
      <button id="subtractButton">-</button>
      <button id="multiplyButton">*</button>
      <button id="divideButton">/</button>
    </div>

    <p id="errorMessage" class="error-text"></p>
    <p class="result-label">Результат: <span id="resultValue">0</span></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
